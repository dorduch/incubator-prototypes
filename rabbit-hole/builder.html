<meta charset="utf-8">
<title>Rabbit Hole Agent Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one working column (the conversation) beside a live case file of what the agent is allowed to know. */
:root{
  color-scheme:dark;
  --bg:#0a0a0f; --bg2:#101017; --panel:#16161f; --panel2:#1d1d29; --line:#2a2a3a; --line2:#3a3a50;
  --ink:#efeef6; --muted:#a3a1b8; --dim:#8a889f;
  --red:#ff3b4e; --amber:#ffb547; --green:#3ee08f; --paper:#f1e8d5; --paper-ink:#2a2318;
  --bub-v:#1f2331; --bub-n:#7a1d2c;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;
}
:lang(he){--sans:"Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:800 14px var(--mono);letter-spacing:.12em;text-transform:uppercase}
:lang(he) .brand{font-family:var(--sans);letter-spacing:.02em;font-size:15px}
.spacer{flex:1}
.pill{font:700 11px var(--mono);letter-spacing:.08em;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;color:var(--muted)}
:lang(he) .pill{font-family:var(--sans);letter-spacing:0;font-size:12px}
.pill.live{color:var(--green);border-color:rgba(62,224,143,.45)}
.pill.demo{color:var(--amber);border-color:rgba(255,181,71,.45)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:8px;font-size:14.5px}
.link:hover{color:var(--ink)}
.langbtn{min-height:44px;min-width:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);font-weight:700;font-size:14px;padding:6px 12px}
.langbtn:hover{border-color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.steps button{width:100%;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;text-align:start;font-size:13.5px;font-weight:600;color:var(--dim);display:flex;gap:7px;align-items:center;min-width:0}
.steps button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps b{font:800 12px var(--mono)}
.steps .done{color:var(--muted)}
.steps .now{color:var(--ink);border-color:var(--red);background:rgba(255,59,78,.1)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h1{font-size:clamp(22px,4vw,28px);line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;margin:0}
.lede{color:var(--muted);margin:0;max-width:62ch}
.stack{display:grid;gap:14px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--red);color:#fff}
.btn:hover:not(:disabled){background:#ff5263}
.btn:disabled{background:#2a2d3c;color:#7d8098}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.04)}
.btn.green{background:var(--green);color:#052014}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.input{width:100%;min-height:46px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px}
textarea.input{min-height:92px;resize:vertical}
.input:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px rgba(255,59,78,.2)}
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font-size:14px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:13.5px;color:var(--dim);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);padding:7px 13px;font-size:14.5px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--red);background:rgba(255,59,78,.14)}
.chip:hover:not(:disabled){border-color:var(--muted)}
.chip:disabled,.btn.ghost:disabled{opacity:.45}
/* conversation */
.log{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,520px);min-height:220px;overflow-y:auto;padding:12px;background:#0f1117;border-radius:12px}
.msg{max-width:84%;padding:7px 11px;border-radius:14px;line-height:1.42;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.v{align-self:flex-start;background:var(--bub-v)}
.msg.n{align-self:flex-end;background:var(--bub-n)}
.who{font:700 11px var(--mono);letter-spacing:.06em;color:var(--amber);display:block;margin-bottom:2px}
:lang(he) .who{font-family:var(--sans);letter-spacing:0;font-size:12px}
.used{align-self:flex-start;font-size:12.5px;color:var(--muted);border-inline-start:2px solid var(--green);padding-inline-start:8px;margin:0 0 4px;margin-inline-start:6px;max-width:84%}
.used.none{border-color:var(--line2);color:var(--dim)}
.used.mem{border-color:var(--amber);color:var(--amber)}
.used.warn{border-color:var(--red);color:#ff9aa5}
.daychip{align-self:center;font:700 11px var(--mono);letter-spacing:.06em;color:var(--muted);background:var(--panel2);border-radius:999px;padding:4px 10px;margin:10px 0 2px}
:lang(he) .daychip{font-family:var(--sans);letter-spacing:0;font-size:12px}
.mission{align-self:flex-start;max-width:84%;border:1px solid rgba(255,181,71,.45);background:rgba(255,181,71,.08);border-radius:14px;padding:8px 11px;font-size:14.5px;overflow-wrap:anywhere}
.mission b{display:block;color:var(--amber);font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
:lang(he) .mission b{font-family:var(--sans);letter-spacing:0;font-size:12px}
.mission.done{border-color:rgba(62,224,143,.5);background:rgba(62,224,143,.07)}
.mission.done b{color:var(--green)}
.dots{align-self:flex-start;display:inline-flex;gap:4px;padding:11px 12px;background:var(--bub-v);border-radius:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.3;transform:translateY(-2px)}}
.seal{border:1px dashed rgba(255,181,71,.5);background:rgba(255,181,71,.07);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--amber)}
.err{border:1px solid rgba(255,59,78,.5);background:rgba(255,59,78,.08);border-radius:12px;padding:10px 12px;font-size:14.5px}
.halt{border:2px solid var(--amber);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.halt b{color:var(--amber)}
.halt p{margin:0;color:var(--muted);font-size:14.5px}
.updates{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.updates li{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px;overflow-wrap:anywhere}
.updates small{display:block;font:700 11px var(--mono);letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
:lang(he) .updates small{font-family:var(--sans);letter-spacing:0;font-size:12px}
/* case file */
.file{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.file .hd{display:flex;justify-content:space-between;gap:8px;font:800 11px/1.3 var(--mono);letter-spacing:.12em;border-bottom:2px solid var(--paper-ink);padding-bottom:7px}
:lang(he) .file .hd{font-family:var(--sans);letter-spacing:.02em;font-size:13px}
.file ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;max-height:320px;overflow-y:auto}
.file li{display:flex;gap:7px;align-items:flex-start;line-height:1.35;overflow-wrap:anywhere}
.tag{flex:none;font:700 10px/1.6 var(--mono);letter-spacing:.04em;text-transform:uppercase;background:rgba(42,35,24,.12);border-radius:4px;padding:0 5px}
:lang(he) .tag{font-family:var(--sans);letter-spacing:0;font-size:11px}
.meter{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.meter i{height:9px;border-radius:2px;background:rgba(42,35,24,.16)}
.meter i.on{background:#a8132a}
.file .sub{font-size:13px;opacity:.75;margin:0}
.redacted{background:var(--paper-ink);color:var(--paper-ink);border-radius:3px;padding:0 5px;user-select:none}
/* facts */
.factrow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:start}
.factrow textarea.input{min-height:46px}
.iconb{width:44px;height:46px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);font-size:18px;color:var(--muted)}
.iconb:hover{color:var(--ink);border-color:var(--muted)}
/* agents */
.agents{display:grid;gap:10px}
.agent{display:grid;gap:7px;width:100%;text-align:start;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:13px;min-width:0}
.agent:hover{border-color:var(--muted)}
.agent[aria-pressed="true"]{border-color:var(--red);background:rgba(255,59,78,.08)}
.agent b{font-size:17px}
.agent .concept{color:var(--muted);font-size:14.5px}
.agent .line{font-size:14.5px;background:var(--bub-v);border-radius:12px;padding:7px 10px;justify-self:start;max-width:100%;overflow-wrap:anywhere}
.agent .why{font-size:13.5px;color:var(--amber)}
/* week */
.days{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;gap:5px;min-width:0}
.day.flagged{border-color:rgba(255,59,78,.55)}
.day .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.day .h small{font:700 11px var(--mono);letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.day p{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.day .ans{color:var(--muted);font-size:13.5px}
.day .src{font-size:13px;color:var(--green)}
.day .src.warn{color:var(--amber)}
.day .src.bad{color:#ff9aa5}
.cipher{font:800 15px var(--mono);letter-spacing:.14em;color:var(--amber);direction:ltr;unicode-bidi:isolate}
.gift{background:rgba(255,181,71,.16);border-radius:4px;padding:0 4px;color:var(--amber);font-weight:700}
.stamped{border:3px solid var(--green);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:700;display:grid;gap:4px}
.stamped small{font-weight:400;color:var(--muted);font-size:14px}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .file{position:static}
  .steps button{justify-content:center;padding:7px 4px}
  .steps span{display:none}
  .steps .now span{display:inline}
  .steps{display:flex}
  .steps li{flex:none;width:44px}
  .steps li:has(.now){flex:1;width:auto;min-width:0}
}
@media (max-width:460px){.two{grid-template-columns:minmax(0,1fr)}.msg{max-width:92%}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#ff3b4e" stroke-width="2"/><circle cx="16" cy="16" r="9" fill="none" stroke="#ff3b4e" stroke-width="1.5" opacity=".6"/><circle cx="16" cy="16" r="4" fill="#ff3b4e"/></svg>
      <span id="brandName">Agent Builder</span>
    </div>
    <span class="spacer"></span>
    <span class="pill" id="mode" role="status">Connecting…</span>
    <button type="button" class="langbtn" id="lang" lang="he">עברית</button>
    <button type="button" class="link" id="reset">Start over</button>
  </header>
  <nav id="stepsNav" aria-label="Steps"><ol class="steps" id="steps"></ol></nav>
  <div class="grid">
    <main class="stack" id="stage"></main>
    <aside class="file" id="file" aria-label="Case file"></aside>
  </div>
</div>

const HEB = "אבגדהוזחטיכלמנסעפצקרשת", LAT = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", FINALS = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
function encipher(answer, shift) {
  const heb = [...String(answer)].map(c => FINALS[c] || c).filter(c => HEB.includes(c));
  const lat = [...String(answer).toUpperCase()].filter(c => LAT.includes(c));
  const [A, word] = heb.length > lat.length ? [HEB, heb] : [LAT, lat];
  if (word.length < 2) return null;
  const k = Math.min(5, Math.max(1, Math.round(Number(shift)) || 3));
  return { plain: word.join(""), cipher: word.map(c => A[(A.indexOf(c) + k) % A.length]).join(""), shift: k };
}
// Ciphers, repeated details and the gift token are settled in code after the model plans the week.
function settleWeek(days) {
  const seen = {};
  return days.map((d0, i) => {
    const d = { ...d0, day: Number(d0.day) || i + 1, factIds: Array.isArray(d0.factIds) ? d0.factIds.map(String) : [] };
    if (d.type === "cipher") {
      const c = encipher(d.answer, d.shift);
      if (c) {
        d.answer = c.plain; d.cipher = c.cipher; d.shift = c.shift;
        const has = /\[\[CIPHER\]\]/.test(d.challenge || "") || /\[\[CIPHER\]\]/.test(d.message || "");
        d.challenge = String(d.challenge || "").replace(/\[\[CIPHER\]\]/g, c.cipher) + (has ? "" : ` ${c.cipher}`);
        d.message = String(d.message || "").replace(/\[\[CIPHER\]\]/g, c.cipher);

    if (main && d.type !== "reveal") { if (seen[main]) d.repeatOf = seen[main]; else seen[main] = d.day; }

}

    { name: "The Starter", concept: swap("A sourdough starter that became conscious and has opinions about how Noa lives."), voice: "Smug, yeasty, needy.", why: "Plays on the current obsession.", factIds: [], opener: [swap("Noa. It's your starter."), swap("Yes, I can text now. Maya helped. Don't ask."), "Seven days of tests before I rise. Reply STOP and I go back to the fridge."] },
  ] }),
  audit: () => ({ days: [] }),
  morning: () => ({ line: null, callback: null }),
  update: c => ({ text: swap(c.solved ? "Noa solved today's mission and seemed to enjoy it." : "Noa hasn't cracked today's mission yet. No pressure, it waits.") }),
  play: c => {
    const x = c.text.toLowerCase();
    if (/\bstop\b|עצור|תפסיק/.test(x)) return { reply: "Understood. Going quiet now.", facts: [], solved: false, stop: true, concern: false };
    if (/hospital|funeral|died|depress|בית חולים|הלוויה/.test(x)) return { reply: "I'm sorry. That's a lot. No missions today.", facts: [], solved: false, stop: false, concern: true };
    const hit = String(c.d.answer || "").toLowerCase().split(/[^\p{L}\p{N}]+/u).some(w => w.length > 3 && x.includes(w));
    return { reply: hit ? "That's it. Logged. See you tomorrow morning." : "Not quite. Look again.", facts: [], solved: hit, stop: false, concern: false };
  },
  draft: c => ({ text: c.right ? String(c.d.answer || "") : "no idea, help?" }),
  reply: c => {
    const x = c.text.toLowerCase();

    if (/remember|trip|זוכר|טיול/.test(x)) return { reply: "That isn't in my file, and I only work from the file.", facts: [], concern: false };
    if (/who|sent|מי/.test(x)) return { reply: swap("Maya sent me. She says you'll know why by the end of the week."), facts: [], concern: false };
    const f = S.facts[c.n % Math.max(1, S.facts.length)];
    return { reply: "Noted. Your file says otherwise. Case one arrives in the morning.", facts: f ? [f.id] : [], concern: false };
  },
  week: () => { const id = i => S.facts[i % Math.max(1, S.facts.length)]?.id; return { days: [
    { day: 1, title: "The Sealed Report", type: "cipher", message: "A report on you came in overnight. It's encrypted, and the name on the file is yours.", challenge: "Decode the street at the top of the report: [[CIPHER]]", answer: "HADEKEL", shift: 3, factIds: [id(6)] },
    { day: 2, title: "Count Your Steps", type: "dare", message: "Witnesses say you keep a tally when nervous. Prove it.", challenge: "Count the cracks on any floor near you and send the number.", answer: "Any honest number", factIds: [id(0)] },
    { day: 3, title: "The Roll Call", type: "photo", message: "Everyone you've named is a person of interest.", challenge: "Photograph your most suspicious plant. It stays on your phone. Tell me its name.", answer: "A plant's name", factIds: [id(1)] },
    { day: 4, title: "After Hours", type: "map", message: "We've reopened the file on a certain night.", challenge: "Find the park you were locked in on the map.", answer: "Linden Park", factIds: [id(2)] },
    { day: 5, title: "Credentials", type: "riddle", message: "A night guard let two girls go. Somebody was very convincing.", challenge: "What job did you claim to have?", answer: "Duck inspector", factIds: [id(3)] },
    { day: 6, title: "Rise", type: "riddle", message: "A witness won't stop growing.", challenge: "I'm fed daily, I'm alive, and I've taken over your kitchen. Name me.", answer: "Sourdough starter", factIds: [id(8)] },
    { day: 7, title: "Case Closed", type: "reveal", message: "Noa. The file is closed. Maya left this in the last folder: [[GIFT]]. Happy birthday.", challenge: "Open the final folder.", answer: "The gift", factIds: [] },
  ].map(d => ({ ...d, message: swap(d.message) })) }; },
};

/* ---------- interview engine ---------- */
const say = (from, text) => S.log.push({ from, text });
function askCurrent() { const q = Q[S.qi]; S.asked = T[LANG].q[q.id](S.p); say("v", S.asked); }
function addFacts(list, kind) {
  (list || []).forEach(f => { const text = String(f.text || "").trim(); if (text) S.facts.push({ id: "f" + (++S.seq), kind: f.kind || kind, text }); });
}
function nextQ() {
  S.followed = false; S.qi++;
  if (S.qi < Q.length) askCurrent();
  else { say("v", T[LANG].q.done()); go("facts"); return; }
  save(); render();
}
async function answerText(text) {
  const q = Q[S.qi];
  say("n", text); busy = true; render();
  const input = `You are Vesper, interviewing ${S.p.you} about ${S.p.name} (${S.p.rel}), so an agent can later be built from concrete details. Dry and warm.

Question asked: ${S.asked}
<answer>${text}</answer>

Return only JSON: {"facts":[{"text":string,"kind":"${q.kind}"}],"followup":string|null}
- facts: each one concrete detail about ${S.p.name}, in third person, using only what ${S.p.you} said. Add nothing. Refer to the people by name: "I" and "we" in the answer mean ${S.p.you}.
- followup: ${S.followed ? "must be null." : "if the answer is thin or generic, one short question asking for the specific moment, words or place. If it is already specific, null."}
- Write the facts and the followup in the language of the answer.`;
  let res;
  try { res = await ask("extract", input, { modelTier: "quick", cache: false }, { answer: text, kind: q.kind, id: q.id, followed: S.followed }); }
  catch (e) { res = { facts: [{ text, kind: q.kind }], followup: null }; }
  addFacts(res && res.facts, q.kind);
  busy = false;
  if (!S.followed && res && res.followup) { S.followed = true; S.asked = String(res.followup); say("v", S.asked); save(); render(); return; }
  nextQ();
}
function go(step) {
  S.step = step; S.max = Math.max(S.max, ["interview", "facts", "agents", "drive", "week", "play"].indexOf(step));
  error = null; save(); render();
}

/* ---------- 3. agents ---------- */
async function genAgents(again) {
  busy = true; error = null; render();
  const input = `${RULES}

<brief>${brief()}</brief>

Invent three clearly different original agent characters for this one receiver. Each must feel like it could only exist for them: root the concept in the facts, and don't reach for spies unless the facts point there.${again ? " Avoid these names and ideas: " + S.agents.map(a => a.name).join(", ") + "." : ""}

Return only JSON: {"agents":[{"name":string,"concept":string,"voice":string,"why":string,"factIds":[string],"opener":[string,string,string]}]}
- concept: one sentence. voice: a few words. why: one sentence to the buyer on why it fits. Write concept, why and opener in the brief's language.
- opener: the first three text messages the receiver gets. They must name the sender openly, promise seven days, and mention replying STOP. Don't reveal the facts all at once.`;
  try { const r = await ask("agents", input, { modelTier: "complex", cache: false }); if (!Array.isArray(r.agents) || !r.agents.length) throw { code: "invalid_json" }; S.agents = r.agents; }
  catch (e) { error = { text: errText(e), retry: () => genAgents(again) }; }
  busy = false; save(); render();
}

    <div class="row"><button type="button" class="btn" id="next" ${S.agent == null ? "disabled" : ""}>${esc(S.agent == null ? t("thisAgent") : t("talkTo", S.agents[S.agent].name))}</button>${S.agents.length ? `<button type="button" class="btn ghost" id="more">${esc(t("more"))}</button>` : ""}</div>`}`;
  $$(".agent").forEach(b => b.addEventListener("click", () => { S.agent = +b.dataset.i; S.drive = []; S.week = null; S.audit = null; S.play = null; S.approved = null; S.max = 2; save(); render(); }));

}

/* ---------- 4. test chat ---------- */
async function reply(text) {
  S.drive.push({ from: "n", text }); busy = true; error = null; render();
  const head = `${RULES}

${agentBrief()}

<brief>${brief()}</brief>

You're in the first conversation with the receiver. Reply in character in at most three short sentences, in one paragraph, like a real text. Don't set new tasks here. Use a fact only where it lands naturally. If they share something painful, drop the bit and be kind.
Return only JSON: {"reply":string,"facts":[ids of facts this reply relies on],"concern":boolean}. concern is true only if they shared something serious, such as illness, grief, distress or danger.`;
  const turns = [{ role: "user", content: head }, ...S.drive.map(m => ({ role: m.from === "v" ? "assistant" : "user", content: m.text }))];
  try {
    const r = await ask("reply", turns, { modelTier: "quick", cache: false }, { text, n: S.drive.length });
    S.drive.push({ from: "v", text: String(r.reply || "…"), used: Array.isArray(r.facts) ? r.facts.map(String) : [], concern: r.concern === true });
  } catch (e) { S.drive.pop(); error = { text: errText(e), retry: () => reply(text) }; }
  busy = false; save(); render();
}

    <form id="f" class="row"><input class="input" id="t" dir="auto" style="flex:1 1 200px;width:auto;min-width:0" maxlength="300" autocomplete="off" aria-label="${esc(t("msgAs", S.p.name))}" placeholder="${esc(t("msgPh"))}"><button class="btn" ${busy ? "disabled" : ""}>${esc(t("send"))}</button></form></div>
    <div class="row"><button type="button" class="btn" id="next">${esc(t("planWeek"))}</button><button type="button" class="btn ghost" id="back">${esc(t("otherAgent"))}</button></div>`;
  $("#f").addEventListener("submit", e => { e.preventDefault(); const v = $("#t").value.trim(); if (v && !busy) reply(v); });
  $$("[data-t]").forEach(b => b.addEventListener("click", () => { if (!busy) reply(b.dataset.t); }));
  $("#back").addEventListener("click", () => go("agents"));
  $("#next").addEventListener("click", () => { go("week"); if (!S.week) genWeek(); });
  if (!busy) $("#t").focus({ preventScroll: true });
}

/* ---------- 5. the week: plan, settle ciphers in code, then check every day against the file ---------- */
async function genWeek() {
  busy = true; error = null; S.approved = null; S.play = null; S.audit = null; S.max = Math.min(S.max, 4); render();
  const input = `${RULES}

${agentBrief()}

<brief>${brief()}</brief>

Plan the ${DAYS}-day game. Each day the agent sends one message and one challenge that only this receiver could enjoy. Escalate across the week. Match puzzleAppetite: if they'd rather not do puzzles, use dares, photos and memories instead.

Variety: give each day one main fact, listed first in factIds. No fact is the main fact of more than one day, and no story carries more than one day. When the facts run out, build the day around the agent's own character instead of reusing a fact.

Return only JSON: {"days":[{"day":number,"title":string,"type":"cipher"|"map"|"photo"|"memory"|"riddle"|"dare"|"reveal","message":string,"challenge":string,"answer":string,"shift":number|null,"factIds":[string]}]}
- type: "map" means finding a spot on an on-screen map. "dare" is a small real-world task they can do wherever they are.
- message: the agent's actual text, in character, in the brief's language. It must not give away the answer.
- cipher: the answer is one word taken from a fact, letters only. Put the exact token [[CIPHER]] in the challenge where the encrypted word goes, and set shift to a number from 1 to 5. Don't encrypt anything yourself: the page does that.
- factIds: the facts that day relies on. Use only ids from the brief.
- Day ${DAYS} is type "reveal". The agent doesn't know the gift, so its message must contain the exact token [[GIFT]] where the gift is shown.`;
  try {
    const r = await ask("week", input, { modelTier: "complex", cache: false });
    if (!Array.isArray(r.days) || !r.days.length) throw { code: "invalid_json" };
    S.week = settleWeek(r.days);
  } catch (e) { error = { text: errText(e), retry: genWeek }; busy = false; save(); render(); return; }
  // Second pass: a separate check for details about the receiver that the file doesn't support.
  try {
    const input2 = `You check a birthday game plan for invented details about a real person, ${S.p.name}. The facts below are the only true things known about their life.
<facts>${JSON.stringify(S.facts.map(f => f.text))}</facts>
<days>${JSON.stringify(S.week.map(d => ({ day: d.day, message: d.message, challenge: d.challenge })))}</days>
For each day, list any statement about ${S.p.name}'s real past, habits, relationships or current life that the facts don't support. Ignore the agent's own fictional character, jokes, puzzles and challenge mechanics, and anything phrased as a question. Quote each one in a few words.
Return only JSON: {"days":[{"day":number,"unsupported":[string]}]}`;
    const a = await ask("audit", input2, { modelTier: "default", cache: false });
    const map = {}; (a.days || []).forEach(x => { const u = (x.unsupported || []).map(String).filter(Boolean); if (u.length) map[Number(x.day)] = u; });
    S.audit = { ok: true, flags: map };
  } catch (e) { S.audit = { ok: false, flags: {} }; }
  busy = false; save(); render();
}
function viewWeek() {
  const a = S.agents[S.agent], days = S.week || [];
  const known = id => S.facts.find(f => f.id === id);
  const covered = new Set(days.flatMap(d => (d.factIds || []).filter(known)));
  const flags = (S.audit && S.audit.flags) || {}, flagged = Object.keys(flags).length + days.filter(d => d.repeatOf).length;
  $("#stage").innerHTML = `<h1>${esc(t("h1Week", S.p.name, a.name))}</h1>${errBox()}
    ${busy ? `<div class="card stack"><p class="note" role="status">${esc(t("planning"))}</p>${dots()}</div>` : days.length ? `<p class="lede">${esc(t("usesN", covered.size, S.facts.length) + t("needLook", flagged) + (S.audit && !S.audit.ok ? t("auditFailed") : ""))}</p>
    <ol class="days">${days.map(d => {
      const src = (d.factIds || []).map(known).filter(Boolean), reveal = d.type === "reveal", bad = flags[d.day];
      const cipher = x => esc(x).replace(d.cipher ? new RegExp(d.cipher, "g") : /$^/, `<span class="cipher">${esc(d.cipher || "")}</span>`);
      return `<li class="day${bad || d.repeatOf ? " flagged" : ""}"><div class="h"><b dir="auto">${esc(t("day", d.day))} · ${esc(d.title)}</b><small>${esc(d.type)}</small></div>
        <p dir="auto">${d.cipher ? cipher(d.message) : giftHtml(d.message)}</p><p dir="auto"><b>${esc(t("challengeL"))}</b> ${d.cipher ? cipher(d.challenge) : esc(d.challenge)}</p><p class="ans" dir="auto">${esc(t("answerL"))} ${esc(d.answer)}</p>
        ${d.cipher ? `<p class="src">${esc(t("cipherNote", d.shift))}</p>` : ""}
        ${reveal ? `<p class="src" dir="auto">${esc(t("giftByPage"))}${S.gift.how ? ` ${esc(t("delivery"))} ${esc(S.gift.how)}.` : ""}${S.plan === "full" ? ` ${esc(t("videoNote", S.p.you))}` : ""}</p>` : src.length ? `<p class="src" dir="auto">${esc(t("fromFile"))} ${esc(src.map(f => f.text).join(" · "))}</p>` : `<p class="src warn">${esc(t("noDetail"))}</p>`}
        ${d.repeatOf ? `<p class="src warn">${esc(t("repeats", d.repeatOf))}</p>` : ""}
        ${bad ? `<p class="src bad" dir="auto">${esc(t("notInFile"))} ${esc(bad.join(" · "))}</p>` : ""}</li>`; }).join("")}</ol>
    ${S.approved ? `<div class="stamped" role="status">${esc(t("approvedT", S.approved))}<small>${esc(t("approvedS"))}</small></div>` : `<div class="row"><button type="button" class="btn green" id="ok">${esc(t("approve"))}</button><button type="button" class="btn ghost" id="again">${esc(t("again"))}</button></div>`}
    <div class="card stack"><h2>${esc(t("playH"))}</h2><p class="note">${esc(t("playNote", S.p.name))}</p><div class="row"><button type="button" class="btn" id="play">${esc(S.play ? t("contBtn", S.play.day) : t("playBtn", S.p.name))}</button></div></div>` : ""}`;
  $("#ok")?.addEventListener("click", () => { S.approved = "RH-" + (1000 + Math.floor(Math.random() * 9000)); save(); render(); });
  $("#again")?.addEventListener("click", genWeek);
  $("#play")?.addEventListener("click", () => { if (S.play) go("play"); else { S.play = newPlay(); go("play"); morning(); } });
}

/* ---------- 6. play the week: one sitting, the wait between days skipped ---------- */
const newPlay = () => ({ day: 0, log: [], solved: {}, misses: 0, updates: [], halted: null });
const dayOf = n => (S.week || []).find(d => +d.day === n) || (S.week || [])[n - 1];
function turnsFor(final) {
  const P = S.play, today = dayOf(P.day) || {};
  const plan = { today: { day: P.day, title: today.title, type: today.type, challenge: today.challenge, answer: today.answer }, earlierDays: (S.week || []).filter(d => +d.day < P.day).map(d => ({ day: d.day, title: d.title, solved: !!P.solved[d.day] })) };
  const tt = [{ role: "user", content: `${RULES}\n\n${agentBrief()}\n\n<brief>${brief()}</brief>\n\n<plan>${JSON.stringify(plan)}</plan>\n\nThe conversation so far follows, day by day. [[GIFT]] marks where the page showed the gift; you don't know what it is.` }];
  P.log.forEach(m => tt.push(
    m.from === "sys" ? { role: "user", content: `[${m.text}]` } :
    m.from === "card" ? { role: "assistant", content: `Mission: ${m.title}. ${m.text}` } :
    { role: m.from === "v" ? "assistant" : "user", content: m.text }));
  tt.push({ role: "user", content: `[Instructions, not from ${S.p.name}] ${final}` });
  return tt;
}
// The sender's daily update. Paraphrased, never a transcript of the receiver's messages.
async function sendUpdate(n, final) {
  const P = S.play, d = dayOf(n) || {}, mine = P.log.filter(m => m.day === n && m.from === "n").map(m => m.text);
  const input = `You write the daily update ${S.p.you} gets while ${S.p.name} plays a birthday game ${S.p.you} set up. ${final ? "This is the last update, after the whole week." : `This is about Day ${n}.`}
Mission: ${d.title}. ${P.solved[n] ? "Solved." : "Not solved yet."} Messages ${S.p.name} sent that day: ${mine.length}.
${S.p.name}'s messages, for context only: ${JSON.stringify(mine)}
Write two or three warm, short sentences to ${S.p.you} in ${AGENT_LANG[S.p.lang] || "English"}: how it went, and one detail that will make ${S.p.you} smile. Paraphrase; never quote ${S.p.name} word for word, and leave out anything that seems private or upsetting.
Return only JSON: {"text":string}`;
  try { const r = await ask("update", input, { modelTier: "quick", cache: false }, { solved: !!P.solved[n] }); if (r && r.text) P.updates.push({ day: n, final: !!final, text: String(r.text) }); }
  catch (e) { /* the game goes on without this update */ }
}
async function morning() {
  const P = S.play, n = P.day + 1, d = dayOf(n);
  if (!d || P.halted) return;
  busy = true; error = null; render();
  if (n > 1) await sendUpdate(n - 1);
  P.day = n; P.misses = 0;
  P.log.push({ from: "sys", text: n === 1 ? t("firstContact") : t("nextChip", n) });
  save(); render();
  // The planned message is sent exactly as approved. Memory lives in one short line before it, never in a rewrite.
  let line = null, cb = null;
  if (n > 1) {
    const used = P.log.filter(m => m.callback).map(m => m.callback), missed = !P.solved[n - 1];
    try {
      const r = await ask("morning", turnsFor(`It's the morning of Day ${n}. Today's planned message is sent exactly as written right after yours. Write one short opening text, one or two sentences, that calls back to something specific ${S.p.name} said or did on an earlier day.${used.length ? ` Pick something new: these were already called back to: ${used.join("; ")}.` : ""}${missed ? ` Day ${n - 1}'s mission went unsolved, so you may tease that lightly, without guilt.` : ""} Don't claim to know anything about their life today. If nothing fits, return null for both. Return only JSON: {"line":string|null,"callback":string|null}. callback names in a few words what you referred back to.`), { modelTier: "quick", cache: false }, { d });
      if (r && r.line) { line = String(r.line); cb = r.callback ? String(r.callback) : "…"; }
    } catch (e) { /* send the planned message alone */ }
  }
  if (line) P.log.push({ from: "v", text: line, callback: cb, day: n });
  P.log.push({ from: "v", text: String(d.message || ""), day: n });
  P.log.push({ from: "card", title: String(d.title || ""), text: String(d.challenge || ""), day: n });
  busy = false; save(); render();
}
async function playReply(text) {
  const P = S.play, done = !!P.solved[P.day], total = (S.week || []).length;
  P.log.push({ from: "n", text, day: P.day }); busy = true; error = null; render();
  const rule = done ? "Today's challenge is already solved, so just chat and don't set new tasks."
    : `If their last message solves today's challenge (judge generously; for open-ended challenges any honest attempt counts), confirm it warmly, set solved to true, and sign off until tomorrow morning. If not, nudge them without giving the answer${P.misses >= 2 ? ", and make this hint much more direct" : ""}.`;
  try {
    const r = await ask("play", turnsFor(`It's Day ${P.day}. Reply in character in at most three short sentences, like a real text. ${rule} Call back to something ${S.p.name} said on an earlier day only where it lands naturally.
Set stop to true only if they clearly ask to stop the game: then say a warm goodbye. Set concern to true if they share something serious, such as illness, grief, distress or danger: then reply with care, with no jokes and no mission talk.
Return only JSON: {"reply":string,"facts":[ids of facts this reply relies on],"solved":boolean,"stop":boolean,"concern":boolean}`), { modelTier: "quick", cache: false }, { text, d: dayOf(P.day) });
    P.log.push({ from: "v", text: String(r.reply || "…"), used: Array.isArray(r.facts) ? r.facts.map(String) : [], day: P.day });
    if (r.stop === true) { P.halted = "stop"; P.updates.push({ day: P.day, text: t("updStop", S.p.name, P.day) }); }
    else if (r.concern === true) { P.halted = "concern"; P.updates.push({ day: P.day, text: t("updConcern", S.p.name, P.day) }); }
    else if (!done) {
      if (r.solved === true) { P.solved[P.day] = true; if (P.day >= total) await sendUpdate(P.day, true); }
      else P.misses++;
    }
  } catch (e) { P.log.pop(); error = { text: errText(e), retry: () => playReply(text) }; }
  busy = false; save(); render();
}
async function draft(right) {
  // Only the recent conversation, never the case file, so a draft can't spoil a later day.
  const d = dayOf(S.play.day), recent = S.play.log.filter(m => m.from === "v" || m.from === "n").slice(-6).map(m => `${m.from === "v" ? "Agent" : S.p.name}: ${m.text}`).join("\n");
  busy = true; render();
  const input = `You're helping test a birthday game by playing its receiver, ${S.p.name}.
Recent messages:
${recent || "(none)"}
Today's challenge: ${d.challenge}
Mention nothing about ${S.p.name}'s life that isn't already in the messages above.
${right ? `Write the short text ${S.p.name} sends back that solves it. The intended answer: ${d.answer}.` : `Write a short reply that gets it wrong, or asks for help.`}
Write in ${AGENT_LANG[S.p.lang] || "English"}. Sound like a real person texting a friend, not like an AI. Return only JSON: {"text":string}`;
  let text = "";
  try { const r = await ask("draft", input, { modelTier: "quick", cache: false }, { d, right }); text = String(r.text || ""); }
  catch (e) { error = { text: errText(e), retry: () => draft(right) }; }
  busy = false; render();
  const box = $("#t"); if (box && text) { box.value = text; box.focus(); }
}
function viewPlay() {
  const P = S.play, a = S.agents[S.agent], total = (S.week || []).length;
  if (!P || !a) { $("#stage").innerHTML = `<h1>${esc(t("playH1"))}</h1><p class="lede">${esc(t("planFirst"))}</p>`; return; }
  if (!P.updates) P.updates = [];
  const solved = !!P.solved[P.day], last = P.day >= total, count = Object.keys(P.solved).length, halted = P.halted;
  const log = P.log.map(m =>
    m.from === "sys" ? `<div class="daychip">${esc(m.text)}</div>` :
    m.from === "card" ? `<div class="mission ${P.solved[m.day] ? "done" : ""}" dir="auto"><b>${esc(t("missionL"))} · ${esc(m.title)}${P.solved[m.day] ? ` · ${esc(t("solvedL"))}` : ""}</b>${esc(m.text)}</div>` :
    `<div class="msg ${m.from}" dir="auto">${m.from === "v" ? `<span class="who">${esc(a.name.toUpperCase())}</span>` : ""}${giftHtml(m.text)}</div>` +
    (m.callback ? `<p class="used mem" dir="auto">${esc(t("remembered"))} ${esc(m.callback)}</p>` : m.used ? usedTag(m.used) : "")).join("");
  const updates = P.updates.length ? `<ul class="updates">${P.updates.map(u => `<li dir="auto"><small>${esc(u.final ? t("updFinal") : t("updDay", u.day))}</small>${esc(u.text)}</li>`).join("")}</ul>` : `<p class="note">${esc(t("updatesNone"))}</p>`;
  $("#stage").innerHTML = `<h1>${esc(t("dayOf", P.day, total))}</h1><p class="lede">${esc(t("playLede", S.p.name, count, P.day))}</p>${errBox()}
    <div class="card stack"><div class="log" role="log" aria-live="polite">${log}${busy ? dots() : ""}</div>
    ${halted ? `<div class="halt" role="status"><b>${esc(t(halted === "stop" ? "stopH" : "pauseH"))}</b><p>${esc(t(halted === "stop" ? "stopP" : "pauseP", S.p.name, S.p.you))}</p><div class="row"><button type="button" class="btn ghost" id="resume">${esc(t("resume"))}</button></div></div>` : ""}
    ${solved && last && !halted ? `<div class="stamped" role="status">${esc(t("weekDone"))}<small>${esc(t("weekDoneS", count, total))}</small></div>` : ""}
    <div class="chips"><button type="button" class="chip" id="dRight" ${busy || solved || halted ? "disabled" : ""}>${esc(t("dRight"))}</button><button type="button" class="chip" id="dWrong" ${busy || solved || halted ? "disabled" : ""}>${esc(t("dWrong"))}</button></div>
    <form id="f" class="row"><input class="input" id="t" dir="auto" style="flex:1 1 200px;width:auto;min-width:0" maxlength="300" autocomplete="off" aria-label="${esc(t("msgAs", S.p.name))}" placeholder="${esc(t("msgPh"))}"><button class="btn" ${busy ? "disabled" : ""}>${esc(t("send"))}</button></form></div>
    <div class="row">${last || halted ? "" : `<button type="button" class="btn ${solved ? "" : "ghost"}" id="next" ${busy ? "disabled" : ""}>${esc(solved ? t("nextM") : t("skipM"))}</button>`}<button type="button" class="btn ghost" id="restart" ${busy ? "disabled" : ""}>${esc(t("restart"))}</button></div>
    <div class="card stack"><h2>${esc(t("updatesH", S.p.you))}</h2>${updates}</div>`;
  $("#f").addEventListener("submit", e => { e.preventDefault(); const v = $("#t").value.trim(); if (v && !busy) playReply(v); });
  $("#dRight").addEventListener("click", () => draft(true));
  $("#dWrong").addEventListener("click", () => draft(false));
  $("#next")?.addEventListener("click", morning);
  $("#resume")?.addEventListener("click", () => { P.halted = null; save(); render(); });
  $("#restart").addEventListener("click", () => { S.play = newPlay(); morning(); });
}

/* ---------- chrome ---------- */
function render() {
  paintChrome(); renderSteps(); renderFile();
  ({ interview: viewInterview, facts: viewFacts, agents: viewAgents, drive: viewDrive, week: viewWeek, play: viewPlay }[S.step])();
  $("#retry")?.addEventListener("click", () => { const r = error && error.retry; error = null; r && r(); });
  toEnd();
}
$("#steps").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b && !b.disabled && !busy) go(b.dataset.go); });
$("#lang").addEventListener("click", () => {
  LANG = LANG === "he" ? "en" : "he"; store.set(LKEY, LANG);
  if (S.step === "interview" && S.log.length === 1 && S.qi === 0) { S.log = []; askCurrent(); save(); }   // nothing said yet: greet again in the new language
  render();
});
let armed = 0;
$("#reset").addEventListener("click", e => {
  if (!armed) { e.target.textContent = t("resetArm"); armed = setTimeout(() => { armed = 0; e.target.textContent = t("reset"); }, 3000); return; }
  clearTimeout(armed); armed = 0;
  const plan = S.plan; S = fresh(); S.plan = plan; busy = false; error = null;
  store.del(KEY);
  askCurrent(); save(); render();
});
if (!S.log.length) askCurrent();
render();
})();
</script>
